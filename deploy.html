<main>
  <h1>Deploy Starcrossed</h1>
  <p>Deploys <code>contracts/Starcrossed.sol</code> (Solidity 0.8.20, optimizer 200 runs, EVM paris) from your MetaMask account. Costs about 0.01 BOT in gas. Do testnet first.</p>
  <div class="card">
    <button id="t">Deploy to Testnet (968)</button>
    <button id="m" class="main">Deploy to Mainnet (677)</button>
    <p id="log">Waiting…</p>
  </div>
  <div class="card" id="known"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>

  m: { key: 'mainnet', chainId: 677, name: 'BOT Chain', rpc: 'https://rpc.botchain.ai', explorer: 'https://scan.botchain.ai' },

const log = html => { document.getElementById('log').innerHTML = html; };
const storeKey = id => 'starcrossed.contract.' + id;

function showKnown() {
  document.getElementById('known').innerHTML = '<b>Deployed from this browser</b>' + Object.values(NETS).map(n => {
    let a = null; try { a = localStorage.getItem(storeKey(n.chainId)); } catch {}
    return `<p>${n.name}: ${a ? `<code>${a}</code> · <a href="${n.explorer}/address/${a}" target="_blank" rel="noopener">explorer</a> · <a href="./${n.key === 'testnet' ? '?net=testnet' : ''}">open app</a>` : 'none yet'}</p>`;
  }).join('');
}

async function deploy(n) {
  if (!window.ethereum) return log('MetaMask not found. Open this page in a browser with MetaMask installed.');
  if (n.key === 'mainnet' && !confirm('Deploy to BOT Chain MAINNET? This spends real BOT and cannot be undone.')) return;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const hex = '0x' + n.chainId.toString(16);
    await ethereum.request({ method: 'eth_requestAccounts' });
    try { await ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: hex }] }); }
    catch (e) {
      if ((e.code ?? e?.data?.originalError?.code) !== 4902) throw e;
      await ethereum.request({ method: 'wallet_addEthereumChain', params: [{
        chainId: hex, chainName: n.name, nativeCurrency: { name: 'BOT', symbol: 'BOT', decimals: 18 },
        rpcUrls: [n.rpc], blockExplorerUrls: [n.explorer] }] });
    }
    const signer = await new ethers.BrowserProvider(ethereum).getSigner();
    log('Confirm the deployment in MetaMask…');
    const c = await new ethers.ContractFactory(ABI, BYTECODE, signer).deploy();
    const tx = c.deploymentTransaction();
    log(`Deploying… tx <a href="${n.explorer}/tx/${tx.hash}" target="_blank" rel="noopener">${tx.hash.slice(0, 12)}…</a>`);
    await c.waitForDeployment();
    const addr = await c.getAddress();
    const check = Number(await c.compatibility(4, 6));
    try { localStorage.setItem(storeKey(n.chainId), addr); } catch {}
    log(`Deployed on ${n.name} ✓\nAddress: <code>${addr}</code>\nSelf-check compatibility(Leo, Libra) = ${check} (expected 76)\n\nPaste this address into the “${n.key}” contract field in index.html (or send it to Claude).`);
    showKnown();
  } catch (e) {
    log('Failed: ' + (e.shortMessage || e.message || e));
  }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
}
document.getElementById('t').onclick = () => deploy(NETS.t);
document.getElementById('m').onclick = () => deploy(NETS.m);
showKnown();
</script>
</body>
</html>
